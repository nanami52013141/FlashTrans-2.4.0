# FlashTrans 2.4.0 云端打包工作流（GitHub Actions）
#
# 作用：在 GitHub 的 Windows 免费 runner 上，自动把你的修改版编译成
#       FlashTrans 的 Windows 安装包（NSIS *-setup.exe）。
#
# 使用方法（只需 3 步，详见同目录《打包步骤.md》）：
#   1) 把本文件放到仓库根目录的  .github/workflows/build-windows.yml
#   2) git push 到你的 GitHub 仓库
#   3) 打一个 tag 并推送：  git tag v2.4.0 && git push --tags
#      之后在仓库 Releases 里就能下载 setup.exe（普通推送也能在 Actions 运行记录里下载产物）。
#
# 产物：src-tauri/target/release/bundle/nsis/FlashTrans_2.4.0_x64-setup.exe
# 说明：模型文件(models)不随包分发，安装后把下载的 models 放到安装目录下即可。

name: Build Windows Setup

on:
  push:
    tags:
      - 'v*'            # 推送 v* 标签时自动构建并发布 Release
  workflow_dispatch:    # 也支持在 Actions 页面手动触发

permissions:
  contents: write      # 发布 Release 需要写权限

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build FlashTrans (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # llama-cpp-2（GGUF 推理）编译期需要 libclang
      - name: Install LLVM (libclang)
        id: llvm
        uses: KyleMayes/setup-llvm@v2
        with:
          version: "18"

      - name: Export LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=${{ steps.llvm.outputs.libclang-path }}" >> $env:GITHUB_ENV

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "flashtrans-next/src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: flashtrans-next/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: npm install (含 vite / tsc / @tauri-apps/cli)
        working-directory: flashtrans-next
        run: npm install

      # 第 2 步：把 backend_bridge.py 冻成 flashtrans-bridge.exe（PyInstaller）
      # 与本地 build.ps1 第 3 步等价；产物被 tauri.conf.json 以 resources 方式打进安装包。
      - name: Build translation bridge (PyInstaller)
        working-directory: flashtrans-next
        run: |
          python -m venv ..\.venv
          ..\.venv\Scripts\python.exe -m pip install -U pip
          ..\.venv\Scripts\pip.exe install -r requirements-bridge.txt pyinstaller
          ..\.venv\Scripts\python.exe -m PyInstaller --noconfirm `
            --distpath installer/bridge-dist `
            --workpath installer/bridge-work `
            installer/bridge.spec

      # 第 3 步：Tauri 构建本体 + NSIS 安装包（会先自动执行 npm run build 产出前端）
      - name: Tauri build (NSIS installer)
        working-directory: flashtrans-next
        run: npm run tauri build

      - name: Show installer output
        run: Get-ChildItem -Recurse flashtrans-next/src-tauri/target/release/bundle | Select-Object FullName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlashTrans-setup
          path: flashtrans-next/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # 仅当推送了 v* 标签时，自动创建 Release 并附上安装包
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flashtrans-next/src-tauri/target/release/bundle/nsis/*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
